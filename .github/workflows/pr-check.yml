# PR 점검: 시나리오 범위 · 문법 · 공통 화면 회귀 · API 테스트. 배포는 하지 않는다.
name: pr-check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: didisam, POSTGRES_PASSWORD: ci-only-pw, POSTGRES_DB: didisam }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U didisam" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 시나리오 범위 · 형식
        env: { BRANCH: '${{ github.head_ref }}' }
        run: node scripts/check-scope.js "origin/${{ github.base_ref }}"
      - name: 문법 검사
        run: for f in service/server/*.js didisam/*.js; do node --check "$f"; done
      - name: 서버 의존성
        run: cd service/server && npm ci --no-fund
      - name: API 테스트
        env: { DATABASE_URL: 'postgresql://didisam:ci-only-pw@localhost:5432/didisam' }
        run: node --test service/test/api.test.js service/test/learner.test.js service/test/tutor.test.js service/test/mcp.test.js service/test/compliance.test.js
      - name: 공통 화면 회귀
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 --no-fund >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/pw/node_modules node tests/ui/smoke.js && NODE_PATH=/tmp/pw/node_modules node tests/ui/compliance.js
