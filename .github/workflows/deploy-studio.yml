# 디디쌤 스튜디오 운영 서비스 — main에 병합되면 테스트 → service/gcp/deploy.sh(Cloud Build → Cloud Run 서울) 자동 배포
# 처음 한 번: Cloud Shell에서 bash service/gcp/github-deploy-setup.sh didisam-studio 를 실행하고,
#   출력된 GCP_PROJECT · WIF_PROVIDER · DEPLOY_SA 를 저장소 Settings › Secrets and variables › Actions › Variables 에 넣는다.
# 변수가 없으면 테스트만 돌고 배포는 건너뛴다. 수동 재배포: Actions › deploy-studio › Run workflow(main).
name: deploy-studio
on:
  push:
    branches: [main]
    paths: ['didisam/**', 'service/**', '.github/workflows/deploy-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: didisam, POSTGRES_PASSWORD: ci-only-pw, POSTGRES_DB: didisam }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U didisam" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 서버 의존성
        run: cd service/server && npm ci --no-fund && npm audit --omit=dev --audit-level=high
      - name: 운영 이미지 폴더 복사
        run: node scripts/check-dockerfile.js
      - name: 문법 검사
        run: for f in service/server/*.js didisam/*.js; do node --check "$f"; done
      - name: API 테스트(가입 · 저장 · 기관 분리 · RLS · AI 정책 · 학습자)
        env: { DATABASE_URL: 'postgresql://didisam:ci-only-pw@localhost:5432/didisam' }
        run: node --test service/test/api.test.js service/test/learner.test.js service/test/tutor.test.js service/test/mcp.test.js service/test/compliance.test.js

  deploy:
    needs: test
    # v38.4: Cloud Shell 수동 배포와 같은 스크립트(service/gcp/deploy.sh)를 그대로 쓴다 — 비밀값 · 메일 · 소셜 로그인 · 도메인 설정이 한 곳에서 관리된다.
    # 한 번만 준비: Cloud Shell에서 bash service/gcp/github-deploy-setup.sh <프로젝트ID> → 출력된 변수 3개(GCP_PROJECT · WIF_PROVIDER · DEPLOY_SA)를 GitHub 저장소 Variables에 넣는다.
    if: ${{ vars.GCP_PROJECT != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 배포(테스트 → Cloud Build → Cloud Run 서울)
        run: bash service/gcp/deploy.sh "${{ vars.GCP_PROJECT }}"
      - name: 새 버전 확인(sw 캐시 이름)
        run: |
          URL=$(gcloud run services describe didisam-studio --project "${{ vars.GCP_PROJECT }}" --region asia-northeast3 --format='value(status.url)')
          WANT=$(grep -o "didisam-app-v[0-9.]*" didisam/sw.js)
          for i in 1 2 3 4 5 6; do GOT=$(curl -fsS "$URL/sw.js" | grep -o "didisam-app-v[0-9.]*" || true); [ "$GOT" = "$WANT" ] && { echo "✅ $GOT"; exit 0; }; sleep 10; done
          echo "운영 sw.js=$GOT, 기대=$WANT"; exit 1
