# 디디쌤 스튜디오 운영 서비스 — 테스트 → 이미지 빌드 → Cloud Run(서울) 배포
# 처음 한 번: service/setup-gcp.sh 를 Cloud Shell에서 실행하고, 출력된 값을
#   저장소 Settings › Secrets and variables › Actions › Variables 에 넣는다:
#   GCP_PROJECT · GCP_REGION · WIF_PROVIDER · DEPLOY_SA · RUN_SA · SQL_INSTANCE
# 변수가 없으면 테스트만 돌고 배포는 건너뛴다(데모 사이트 GitHub Pages에는 영향 없음).
name: deploy-studio
on:
  push:
    branches: [main]
    paths: ['didisam/**', 'service/**', '.github/workflows/deploy-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: didisam, POSTGRES_PASSWORD: ci-only-pw, POSTGRES_DB: didisam }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U didisam" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 서버 의존성
        run: cd service/server && npm ci --no-fund && npm audit --omit=dev --audit-level=high
      - name: 문법 검사
        run: for f in service/server/*.js didisam/*.js; do node --check "$f"; done
      - name: API 테스트(가입 · 저장 · 기관 분리 · RLS · AI 정책)
        env: { DATABASE_URL: 'postgresql://didisam:ci-only-pw@localhost:5432/didisam' }
        run: node --test service/test/api.test.js

  deploy:
    needs: test
    if: ${{ vars.GCP_PROJECT != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
      IMAGE: ${{ vars.GCP_REGION || 'asia-northeast3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/didisam/studio:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 이미지 빌드 · 푸시
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f service/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Cloud Run 배포
        run: |
          gcloud run deploy didisam-studio \
            --project "${{ vars.GCP_PROJECT }}" --region "$REGION" --image "$IMAGE" \
            --service-account "${{ vars.RUN_SA }}" \
            --add-cloudsql-instances "${{ vars.SQL_INSTANCE }}" \
            --set-secrets "DATABASE_URL=didisam-db-url:latest,ANTHROPIC_API_KEY=didisam-anthropic-key:latest,SIGNUP_CODE=didisam-signup-code:latest" \
            --set-env-vars "DB_POOL=5,AI_DAILY_CALLS=400" \
            --ingress internal-and-cloud-load-balancing --allow-unauthenticated \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 4 --concurrency 60 --timeout 120 \
            --quiet
      - name: 실주소 확인
        continue-on-error: true
        run: curl -fsS --retry 6 --retry-delay 10 https://${{ vars.STUDIO_DOMAIN || 'studio.aisam.com' }}/api/health
