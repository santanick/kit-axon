# 디디쌤 gitleaks 설정 — 기본 규칙 + 디디쌤 키 형식. gitleaks v8.25 이상(allowlists 배열 형식), 버전은 CI에서 정확히 고정합니다.
# 실행: gitleaks git --config .gitleaks.toml --redact -v   (이력 전체, 주 1회)
#       gitleaks dir --config .gitleaks.toml --redact .    (작업 폴더, pre-commit · PR)
# 발견 즉시: 키 비활성(긴급 차단 ①) → 재발급 → 이력 정리 여부는 사람이 판단. 결과 파일에는 --redact로 값이 남지 않게 합니다.
title = "didisam gitleaks"

[extend]
useDefault = true

# ── 디디쌤 자체 키 ──────────────────────────────────────────────
[[rules]]
id = "didisam-mcp-api-key"
description = "디디쌤 외부 AI 연결(MCP) 키: dds_ + base64url 40자(service/server/mcp.js)"
regex = '''\b(dds_[A-Za-z0-9_-]{40})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["dds_"]
tags = ["didisam", "api-key"]

[[rules]]
id = "didisam-live-key"
description = "디디쌤 운영 키 표기 dd_live_ (예전 형식 · 화면 예시는 접두 12자뿐이라 걸리지 않음)"
regex = '''\b(dd_live_[A-Za-z0-9_-]{16,})'''
secretGroup = 1
keywords = ["dd_live_"]
tags = ["didisam", "api-key"]

[[rules]]
id = "didisam-server-secret-env"
description = "운영 비밀값 환경변수 대입(PII_KEY · SESSION_PEPPER · GUARD_TOKEN · STATE_KEY · OAUTH 비밀)"
regex = '''(?i)\b(?:PII_KEY|SESSION_PEPPER|GUARD_TOKEN|STATE_KEY|[A-Z_]*CLIENT_SECRET|SLACK_WEBHOOK_URL|TOSS_SECRET_KEY)\b\s*[:=]\s*['"]?([^\s'"<>$,]{12,})'''
secretGroup = 1
entropy = 3.0
keywords = ["pii_key", "session_pepper", "guard_token", "state_key", "client_secret", "slack_webhook_url", "toss_secret_key"]
tags = ["didisam", "env"]

[[rules]]
id = "didisam-pii-key-hex"
description = "PII_KEY 형식(AES-256 32바이트 hex 64자)이 코드 · 설정에 박힌 경우"
regex = '''(?i)\bPII_KEY\b[^\n]{0,8}?['"=:\s]([0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["pii_key"]
tags = ["didisam", "crypto"]

[[rules]]
id = "toss-payments-live-secret"
description = "토스페이먼츠 운영 비밀키(live_sk_ · live_gsk_)"
regex = '''\b(live_g?sk_[0-9A-Za-z]{20,})\b'''
secretGroup = 1
keywords = ["live_sk_", "live_gsk_"]
tags = ["payment"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth 클라이언트 비밀(GOCSPX-)"
regex = '''\b(GOCSPX-[A-Za-z0-9_-]{28})\b'''
secretGroup = 1
keywords = ["gocspx-"]
tags = ["oauth"]

# ── 허용 목록: 테스트 더미만(실제 키 형식과 겹치지 않는 고정 문자열) ──
[[allowlists]]
description = "테스트 · CI 더미 값"
regexTarget = "secret"
regexes = [
  '''^sk-ant-test[A-Za-z0-9_-]*$''',
  '''^sk-ant-api03-(?:x{8,}|ABCDEFGHIJKLMNOP)$''',
  '''^sk-ant-abcdefghijklmnop[0-9]*$''',
  '''^0{64}$''',
  '''^ci-only[A-Za-z0-9_-]*$''',
  '''^dds_Q2hlY2tPbmx5RHVtbXlLZXlGb3JSZWRUZWFtMDA$''',
  '''not-for-production''',
  '''^test_g?sk_[A-Za-z0-9_]*$''',
  # 값이 아니라 참조인 경우: Secret Manager 이름(didisam-…:latest) · 코드 식(crypto.randomBytes … · process.env …)
  '''^didisam-[a-z0-9-]+(?::(?:latest|[0-9]+))?,?$''',
  '''^(?:crypto|process|env|Buffer|require)[.(]''',
]

[[allowlists]]
description = "일반 키 규칙(엔트로피 기반)은 시험 · 픽스처 폴더에서 끔 — 디디쌤 · 결제 · OAuth 규칙은 여기서도 검사"
targetRules = ["generic-api-key"]
paths = [
  '''^service/test/''',
  '''^service-egov/test/''',
  '''^tests/''',
  '''^security/redteam/''',
  '''(?:^|/)package-lock\.json$''',
]
