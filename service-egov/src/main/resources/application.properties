# 디디쌤 운영 서버 — 전자정부 표준프레임워크 에디션
server.port=${PORT:8080}
server.tomcat.max-swallow-size=16MB
server.tomcat.max-http-form-post-size=16MB
spring.datasource.url=${JDBC_URL:jdbc:postgresql://127.0.0.1:5432/didisam}
spring.datasource.username=${JDBC_USER:didisam}
spring.datasource.password=${JDBC_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
mybatis.mapper-locations=classpath:egovframework/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=false
# 화면(public/) — Node 서버 PUBLIC_DIR과 같은 폴더를 그대로 쓴다
spring.web.resources.static-locations=file:${PUBLIC_DIR:public}/
spring.web.resources.cache.period=300
spring.mvc.throw-exception-if-no-handler-found=true
spring.main.banner-mode=off
